  <div class="d-flex align-center justify-between mb-4">
    <div>
      <h1 class="page-title">Fiscal Years</h1>
      <p class="page-subtitle">Manage fiscal year periods.</p>
    </div>
    <button type="button" class="btn btn-primary" (click)="openAddModal()">Add Fiscal Year</button>
  </div>

  @if (showForm()) {
    <div class="modal-backdrop" (click)="onCancelEdit()">
      <div class="modal-dialog" (click)="$event.stopPropagation()">
        <div class="modal-header">
          <h3>{{ editingId() ? 'Edit Fiscal Year' : 'New Fiscal Year' }}</h3>
          <button type="button" class="close-btn" (click)="onCancelEdit()" aria-label="Close"><svg lucideIcon="x" size="18"></svg></button>
        </div>
        <div class="modal-body">
          <form [formGroup]="form" (ngSubmit)="editingId() ? onUpdate() : onSubmit()" novalidate>
            <div class="form-group">
              <label class="form-label" for="fy-label">Label</label>
              <input id="fy-label" class="form-control" type="text" formControlName="label" placeholder="e.g. FY2026" />
              @if (form.controls.label.invalid && form.controls.label.touched) {
                <p class="form-error">Label is required.</p>
              }
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="fy-start">Start Date</label>
                <input id="fy-start" class="form-control" type="date" formControlName="startDate" />
              </div>
              <div class="form-group">
                <label class="form-label" for="fy-end">End Date</label>
                <input id="fy-end" class="form-control" type="date" formControlName="endDate" />
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" (click)="onCancelEdit()">Cancel</button>
              <button type="submit" class="btn btn-primary" [disabled]="form.invalid || submitting()">
                {{ submitting() ? 'Saving…' : (editingId() ? 'Update' : 'Save') }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  }

  @if (loadError()) {
    <div class="alert alert-danger" role="alert">{{ loadError() }}</div>
  }

  <div class="card">
    <div class="card-body grid-actions-host">
      <app-grid-table [rowData]="rows()" [columnDefs]="columnDefs" [loading]="loading()" (cellValueChanged)="onCellValueChanged($event)" />
    </div>
  </div>
