  <div class="d-flex align-center justify-between mb-4">
    <div>
      <h1 class="page-title">Fiscal Years</h1>
      <p class="page-subtitle">Manage fiscal year periods.</p>
    </div>
    <button type="button" class="btn btn-primary" (click)="openAddModal()">Add Fiscal Year</button>
  </div>

  @if (showForm()) {
    <app-fiscal-year-form
      [form]="fiscalYearForm"
      [mode]="editingId() ? 'edit' : 'create'"
      [locked]="datesLocked()"
      [submitting]="submitting()"
      [endDate]="fiscalYearEndDate()"
      (submitted)="editingId() ? onUpdate() : onSubmit()"
      (cancelled)="onCancelEdit()"
    />
  }

  @if (loadError()) {
    <div class="alert alert-danger" role="alert">{{ loadError() }}</div>
  }

  <div class="card">
    <div class="card-body grid-actions-host">
      <app-grid-table [rowData]="rows()" [columnDefs]="columnDefs" [loading]="loading()" (cellValueChanged)="onCellValueChanged($event)" />
    </div>
  </div>
