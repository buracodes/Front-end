<div class="filters">
  <div class="field">
    <label for="dx-fy">Fiscal year</label>
    <select
      id="dx-fy"
      class="select"
      [disabled]="disabled() || busy()"
      [value]="current().fiscalYearId ?? ''"
      (change)="onFiscalYear($any($event.target).value)"
    >
      <option value="">All fiscal years</option>
      @for (year of fiscalYears(); track year.id) {
        <option [value]="year.id">{{ year.label }}</option>
      }
    </select>
  </div>

  <div class="field">
    <label for="dx-scorecard">Scorecard</label>
    <select
      id="dx-scorecard"
      class="select"
      [disabled]="disabled() || busy()"
      [value]="current().scorecardId ?? ''"
      (change)="onScorecard($any($event.target).value)"
    >
      @if (!scorecardSelectionRequired()) {
        <option value="">All scorecards</option>
      }
      @for (scorecard of scorecards(); track scorecard.id) {
        <option [value]="scorecard.id">{{ scorecard.label }}</option>
      }
    </select>
  </div>

  <div class="field period-field" [class.open]="periodOpen()">
    <label for="dx-period">Period</label>
    <button
      #periodTrigger
      id="dx-period"
      type="button"
      class="btn btn-secondary period-btn"
      [class.active]="periodOpen()"
      [disabled]="disabled() || busy()"
      aria-haspopup="dialog"
      [attr.aria-expanded]="periodOpen()"
      (click)="togglePeriod()"
    >
      Filter by Period
      @if (hasPeriodFilter()) {
        <span class="period-dot" title="Period filter active"></span>
      }
      <svg lucideIcon="chevron-down" size="12"></svg>
    </button>

    @if (periodOpen()) {
      <div
        class="period-panel"
        role="dialog"
        aria-label="Filter by period"
        [style.top.px]="panelPosition().top"
        [style.left.px]="panelPosition().left"
      >
        <div class="period-types">
          <button type="button" [class.active]="tab() === 'Ytd'" (click)="selectTab('Ytd')">YTD</button>
          <button type="button" [class.active]="tab() === 'Month'" (click)="selectTab('Month')">Month</button>
          <button type="button" [class.active]="tab() === 'Quarter'" (click)="selectTab('Quarter')">Quarter</button>
          <button type="button" [class.active]="tab() === 'Year'" (click)="selectTab('Year')">Year</button>
        </div>

        @if (tab() === 'Ytd') {
          <p class="period-hint">Shows the fiscal year from its start through the current period.</p>
        } @else if (tab() === 'Month') {
          <div class="period-month-row" [class.invalid]="monthRangeInvalid()">
            <select
              class="select"
              aria-label="From month"
              [disabled]="disabled() || busy()"
              (change)="onMonthFrom($event)"
            >
              <option value="">From</option>
              @for (month of monthOptions(); track month.value) {
                <option [value]="month.value" [selected]="month.value === monthFrom()">{{ month.label }}</option>
              }
            </select>
            <span class="period-sep">to</span>
            <select
              class="select"
              aria-label="To month"
              [disabled]="disabled() || busy()"
              (change)="onMonthTo($event)"
            >
              <option value="">To</option>
              @for (month of monthOptions(); track month.value) {
                <option [value]="month.value" [selected]="month.value === monthTo()">{{ month.label }}</option>
              }
            </select>
          </div>
          @if (monthRangeInvalid()) {
            <p class="period-error">From month must be before or equal to To month.</p>
          }
        } @else if (tab() === 'Quarter') {
          <select
            class="select period-select"
            aria-label="Quarter"
            [disabled]="disabled() || busy()"
            (change)="onQuarter($event)"
          >
            <option value="">Select quarter</option>
            @for (option of quarterOptions(); track option.value) {
              <option [value]="option.value" [selected]="option.value === quarter()">{{ option.label }}</option>
            }
          </select>
        } @else {
          <select
            class="select period-select"
            aria-label="Fiscal year"
            [disabled]="disabled() || busy()"
            (change)="onPeriodFiscalYear($any($event.target).value)"
          >
            <option value="">Select fiscal year</option>
            @for (year of fiscalYears(); track year.id) {
              <option [value]="year.id" [selected]="year.id === current().fiscalYearId">{{ year.label }}</option>
            }
          </select>
        }

        <button type="button" class="period-clear" (click)="clearPeriodFilter()">Clear Period Filter</button>
      </div>
    }
  </div>

  @if (busy()) {
    <span class="spinner" aria-label="Refreshing"></span>
  }
</div>
